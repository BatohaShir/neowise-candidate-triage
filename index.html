<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status:empty, #result[hidden] { display: none; }
    #status { padding: .5rem .75rem; border-radius: .25rem; background: #f1f3f5; }
    #status[data-kind="manual"], #status[data-kind="invalid"] { background: #fff4e5; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа (проверьте перед отправкой клиенту)</label>
    <textarea id="draft" rows="6"></textarea>
  </section>
  <script type="module">
    import { viewFor, MESSAGES } from "/triage-view.mjs";

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    let lastRequest = 0;
    let inFlight = null;

    function render(view) {
      status.dataset.kind = view.kind;
      status.textContent = view.message;
      topic.textContent = view.topic;
      draft.value = view.draft;
      result.hidden = view.kind !== "ready";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (message.value.trim() === "") {
        render({ kind: "invalid", topic: "", draft: "", message: MESSAGES.empty });
        return;
      }

      // A new request clears the previous answer and cancels the one still running.
      const id = ++lastRequest;
      inFlight?.abort();
      inFlight = new AbortController();
      render({ kind: "loading", topic: "", draft: "", message: "Разбираем заявку…" });
      button.disabled = true;

      let view;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: inFlight.signal,
        });
        const body = await reply.json().catch(() => null);
        view = viewFor(reply.status, body);
      } catch (error) {
        if (error.name === "AbortError") return;
        view = viewFor(0, null);
      }
      if (id !== lastRequest) return; // a newer request owns the screen
      render(view);
      button.disabled = false;
    });
  </script>
</body>
</html>
